<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iArchive</title>

<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #ffffff;
  --line: #d6d6d6;
  --text: #1d1d1f;
  --muted: #8a8a8f;
  --accent: #007aff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px 16px 40px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 15px;
}

main {
  max-width: 680px;
  margin: auto;
}

header {
  margin: 8px 0 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

h1 {
  font-size: 30px;
  letter-spacing: -0.7px;
  margin: 5px 0;
  font-weight: 700;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.search {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}

input {
  min-width: 0;
  flex: 1;
  padding: 11px 12px;
  border: 1px solid #c8c8cc;
  border-radius: 9px;
  background: #f2f2f7;
  color: var(--text);
  font-size: 16px;
  outline-color: var(--accent);
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  background: var(--accent);
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#status {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 2px;
}

.card,
.detail {
  background: var(--panel);
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 14px 2px;
  margin: 0;
}

.card {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.card:active {
  background: #f2f2f7;
}

.appicon {
  width: 58px;
  height: 58px;
  border-radius: 13px;
  object-fit: cover;
  background: #eeeeef;
  border: 1px solid #e5e5e5;
}

.appname {
  font-weight: 600;
  font-size: 16px;
}

.dev {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
}

.arrow {
  margin-left: auto;
  color: var(--accent);
  font-size: 22px;
}

h2 {
  font-size: 20px;
  margin: 0 0 14px;
  font-weight: 700;
}

.label {
  color: var(--muted);
  font-size: 12px;
  margin-top: 13px;
}

.value {
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.pill {
  display: inline-block;
  padding: 4px 8px;
  background: #e5f1ff;
  color: #0063ce;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}

a {
  color: var(--accent);
}

.small {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.hidden {
  display: none;
}

.sectiontitle {
  margin-top: 24px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  font-size: 17px;
  font-weight: 700;
}

footer {
  margin-top: 30px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.download-button {
  display: inline-block;
  padding: 8px 15px;
  margin: 6px 6px 6px 0;
  border-radius: 7px;
  background: var(--accent);
  color: #ffffff !important;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}

.download-button:hover {
  background: #0063ce;
}

.download-unavailable {
  display: inline-block;
  padding: 7px 10px;
  margin: 6px 0;
  border-radius: 6px;
  background: #f2f2f7;
  color: #77777c;
  font-size: 13px;
  border: 1px solid var(--line);
}

.copy-card {
  margin: 10px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fafafa;
}

.copy-title {
  margin-bottom: 6px;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

.copy-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
header {
  margin: 12px 0 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid #d6d6d6;
}

.logo {
  color: #007aff;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
}

h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.8px;
  margin: 8px 0;
}

.subtitle {
  color: #8e8e93;
  font-size: 14px;
  line-height: 1.5;
}

/* iOS 9 App Store風：検索・結果エリア */

#status {
  padding: 4px 2px 10px;
  color: #8e8e93;
  font-size: 13px;
}

#results {
  margin-top: 8px;
  border-top: 1px solid #d6d6d6;
}

#results .card {
  background: #fff;
  border: 0;
  border-bottom: 1px solid #d6d6d6;
  border-radius: 0;
  padding: 13px 4px;
  margin: 0;
  gap: 12px;
}

#results .card:active {
  background: #f2f2f7;
  opacity: 1;
}

#results .appicon {
  width: 60px;
  height: 60px;
  border-radius: 13px;
}

#results .appname {
  color: #007aff;
  font-size: 16px;
  font-weight: 600;
}

#results .dev {
  color: #8e8e93;
  font-size: 12px;
}

#results .arrow {
  color: #c7c7cc;
  font-size: 25px;
  font-weight: 300;
}

#details .detail {
  background: #fff;
  border: 1px solid #d6d6d6;
  border-radius: 12px;
  padding: 16px;
  margin: 14px 0;
}

#details h2 {
  color: #1d1d1f;
  font-size: 20px;
}

#details .pill {
  background: #e5f1ff;
  color: #007aff;
  border-radius: 6px;
}

#details .copy-card {
  background: #f2f2f7;
  border: 1px solid #e0e0e5;
  border-radius: 10px;
}

#details .copy-title {
  color: #3a3a3c;
}

/* iOS 9風 検索バー */

.search {
  display: flex;
  gap: 8px;
  margin: 22px 0 18px;
  align-items: center;
}

.search input {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  border: 1px solid #c8c8cd;
  border-radius: 8px;
  background: #f2f2f7;
  color: #1d1d1f;
  font-size: 16px;
  outline: none;
  box-shadow: none;
}

.search input::placeholder {
  color: #8e8e93;
}

.search input:focus {
  border-color: #007aff;
  background: #fff;
}

.search button {
  height: 40px;
  padding: 0 17px;
  border-radius: 8px;
  background: #007aff;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  box-shadow: none;
  -webkit-appearance: none;
  appearance: none;
}

.search button:active {
  background: #0063d1;
}

.search button:disabled {
  background: #a7cfff;
  opacity: 1;
}

/* iOS 9風 バージョン一覧 */

#details .version-row {
  padding: 16px 14px;
  margin: 0;
  background: #fff;
  border-bottom: 1px solid #d6d6d6;
}

#details .version-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

#details .version-heading > strong {
  font-size: 17px;
  color: #007aff;
}

#details .version-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 13px;
  font-size: 13px;
}

#details .version-meta span {
  color: #8e8e93;
}

#details .version-meta strong {
  font-weight: 500;
  color: #3a3a3c;
}

#details .status-ok {
  background: #e5f5e9;
  color: #248a3d;
}

#details .status-no {
  background: #ffe8e8;
  color: #d70015;
}

#details .status-unknown {
  background: #eeeeef;
  color: #636366;
}

#details .version-links {
  margin-top: 10px;
}

#details .version-links .copy-card {
  margin: 8px 0 0;
  padding: 10px;
}

/* iArchive: iOS 9風の仕上げ */
body {
  background: #f2f2f7;
}

header {
  background: #ffffff;
  margin: -16px -16px 18px;
  padding: 22px 16px 18px;
  border-bottom: 1px solid #d6d6d6;
}

.detail {
  background: #ffffff;
  border: 1px solid #d6d6d6;
  border-radius: 10px;
  padding: 16px;
  margin: 14px 0;
}

/* iOS 9風：検索結果リストの仕上げ */
#results {
  margin-top: 8px;
  border-top: 1px solid #d6d6d6;
  background: #fff;
}

#results .card {
  display: flex;
  align-items: center;
  min-height: 82px;
  padding: 11px 4px;
  margin: 0;
  gap: 12px;
  background: #fff;
  border: 0;
  border-bottom: 1px solid #d6d6d6;
  border-radius: 0;
}

#results .appicon {
  flex: 0 0 60px;
  width: 60px;
  height: 60px;
  border-radius: 13px;
  object-fit: cover;
}

#results .appname {
  color: #007aff;
  font-size: 16px;
  font-weight: 600;
}

#results .dev {
  color: #8e8e93;
  font-size: 12px;
}

#results .arrow {
  margin-left: auto;
  color: #c7c7cc;
  font-size: 25px;
}

#results .card:active {
  background: #e5e5ea;
}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">LEGACY TOOLS</div>
    <h1>アプリを探す</h1>
    <div class="subtitle">過去のiOSアプリと対応バージョンを検索</div>
  </header>

  <form class="search" id="searchForm">
    <input id="query" placeholder="アプリ名を検索..." autocomplete="off" required>
    <button id="searchButton" type="submit">検索</button>
  </form>

  <div class="label">App StoreのURLから検索</div>
<form class="search" id="urlForm">
  <input
    id="appStoreURL"
    type="url"
    placeholder="App StoreのURLを貼り付け..."
    autocomplete="url"
  >
  <button type="submit">開く</button>
</form>

<div class="detail">

  <div class="label">あなたの端末のiOSバージョン</div>

  <div class="search">

    <input id="deviceIOS" value="15.8.3"

           inputmode="decimal" placeholder="例：15.8.3">
  </div>
  <div id="status">アプリ名を入力して検索してください。</div>
  <section id="results"></section>
  <section id="details" class="hidden"></section>

  <footer>
    Legacy Finder Preview · Data provided by Apple's public iTunes Search API.<br>
    過去バージョン情報とIPA取得機能はまだ接続されていません。
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const statusBox = $("status");
const resultsBox = $("results");
const detailsBox = $("details");

$("urlForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = $("appStoreURL").value.trim();

  // App Store URLからアプリIDを抽出
  const match = input.match(
    /^https?:\/\/apps\.apple\.com\/[^?#]*\/id(\d+)(?:[/?#]|$)/i
  );

  if (!match) {
    statusBox.textContent =
      "有効なApp StoreのURLを入力してください。";
    return;
  }

  const appId = match[1];

  statusBox.textContent = "アプリ情報を取得中...";
  resultsBox.innerHTML = "";
  detailsBox.innerHTML = "";
  detailsBox.classList.add("hidden");

  try {
    const response = await fetch(
      `https://itunes.apple.com/lookup?id=${encodeURIComponent(appId)}&country=jp`
    );

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const data = await response.json();
    const app = data.results?.[0];

    if (!app) {
      statusBox.textContent =
        "アプリが見つかりません。公開状況やURLを確認してください。";
      return;
    }

    statusBox.textContent = "アプリが見つかりました。履歴を確認します。";
    await showDetails(app);

  } catch (error) {
    statusBox.textContent =
      "アプリ情報を取得できませんでした。通信環境を確認してください。";
  }
});

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  const query = $("query").value.trim();
  if (!query) return;

  $("searchButton").disabled = true;
  statusBox.textContent = "検索中...";
  resultsBox.innerHTML = "";
  detailsBox.innerHTML = "";
  detailsBox.classList.add("hidden");

  try {
    const url = "https://itunes.apple.com/search?term=" +
      encodeURIComponent(query) + "&entity=software&country=jp&limit=25";
    const response = await fetch(url);
    if (!response.ok) throw new Error("検索APIに接続できませんでした。");
    const data = await response.json();

    if (!data.results || data.results.length === 0) {
      statusBox.textContent = "アプリが見つかりませんでした。";
      return;
    }

    statusBox.textContent = `${data.results.length}件のアプリが見つかりました。`;

    data.results.forEach(app => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <img class="appicon" src="${escapeHTML(app.artworkUrl100 || "")}" alt="">
        <div style="min-width:0">
          <div class="appname">${escapeHTML(app.trackName)}</div>
          <div class="dev">${escapeHTML(app.artistName)}</div>
          <div class="dev">ID: ${escapeHTML(app.trackId)}</div>
        </div>
        <div class="arrow">›</div>`;
      card.addEventListener("click", () => showDetails(app));
      resultsBox.appendChild(card);
    });
  } catch (error) {
    statusBox.textContent = "検索に失敗しました。通信環境を確認して、もう一度試してください。";
  } finally {
    $("searchButton").disabled = false;
  }
});


function compareVersions(a, b) {
  const pa = String(a || "0").split(".").map(n => parseInt(n, 10) || 0);
  const pb = String(b || "0").split(".").map(n => parseInt(n, 10) || 0);
  const length = Math.max(pa.length, pb.length);

  for (let i = 0; i < length; i++) {
    const x = pa[i] || 0;
    const y = pb[i] || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

async function showDetails(app) {
  detailsBox.classList.remove("hidden");
  detailsBox.innerHTML =
    '<div class="detail">バージョン履歴を取得中...</div>';
  detailsBox.scrollIntoView({ behavior: "smooth", block: "start" });

  const deviceIOS = $("deviceIOS").value.trim();

  if (!/^\d+(\.\d+){0,2}$/.test(deviceIOS)) {
    detailsBox.innerHTML = `
      <div class="detail">
        iOSバージョンを正しく入力してください。例：15.8.3
      </div>`;
    return;
  }

try}
  let data = null;
  let versions = [];
  let historySource = "Legacy Store";

// まず既存のLegacy Storeを試す
try {
  const response = await fetch(
    `https://legacystore.app/api/v1/apps/${encodeURIComponent(app.trackId)}`
  );

  if (response.ok) {
    data = await response.json();
    versions = Array.isArray(data.versions)
      ? data.versions
      : [];
  }
} catch (error) {
  // 失敗した場合は次のAPIを試す
}

// 履歴が取得できなかった場合、別のAPIを試す
if (versions.length === 0) {
  const fallbackResponse = await fetch(
    `https://apis.bilin.eu.org/history/${encodeURIComponent(app.trackId)}`
  );

  if (!fallbackResponse.ok) {
    throw new Error("両方の履歴APIから取得できませんでした");
  }

  const fallbackData = await fallbackResponse.json();
  const fallbackVersions = Array.isArray(fallbackData.data)
    ? fallbackData.data
    : [];

  if (fallbackVersions.length === 0) {
    throw new Error("別のAPIにもバージョン履歴がありません");
  }

  versions = fallbackVersions.map(item => ({
    version: item.bundle_version || "不明",
    external_identifier: item.external_identifier || "",
    minimum_os_version: null,
    copies: []
  }));

  data = {
    name: app.trackName,
    versions
  };

  historySource = "MuffinStore互換API";
}

function hasDownloadableCopy(version) {
  const copies = Array.isArray(version.copies)
    ? version.copies
    : [];

  return copies.some(copy =>
    typeof copy.download_url === "string" &&
    /^https?:\/\//i.test(copy.download_url)
  );
}

// iOSの条件を満たし、IPAのダウンロードリンクがある版を優先
const compatibleVersions = versions.filter(v =>
  v.version &&
  v.minimum_os_version &&
  compareVersions(deviceIOS, v.minimum_os_version) >= 0
);

compatibleVersions.sort((a, b) =>
  compareVersions(b.version, a.version)
);

const downloadableVersions = compatibleVersions.filter(
  hasDownloadableCopy
);

// ダウンロードリンク付きの候補があればそちらを推薦
const recommended = downloadableVersions[0] || compatibleVersions[0];
const recommendationHasDownload = Boolean(
  recommended && hasDownloadableCopy(recommended)
);

    
const recommendation = recommended
  ? `
    <div class="detail" style="border-color:#7c9cff">
      <span class="pill">${
        recommendationHasDownload
          ? "おすすめ・DLリンクあり"
          : "おすすめ・DL未確認"
      }</span>

      <h2 style="margin-top:12px">
        Version ${escapeHTML(recommended.version)}
      </h2>

      <div class="label">最低対応iOS</div>
      <div class="value">
        ${escapeHTML(recommended.minimum_os_version)}
      </div>

      <div class="small" style="margin-top:10px">
        iOS ${escapeHTML(deviceIOS)} は最低対応OSの条件を満たしています。
        実際のインストール可否は別途確認が必要です。
      </div>

      ${
        (() => {
          const copies = Array.isArray(recommended.copies)
            ? recommended.copies
            : [];

          const copy = copies.find(c =>
            typeof c.download_url === "string" &&
            /^https?:\/\//i.test(c.download_url)
          );

          return copy
            ? `<a class="download-button"
                 href="${escapeHTML(copy.download_url)}"
                 target="_blank"
                 rel="noopener noreferrer"
                 style="margin-top:14px">
                 ⬇ IPAをダウンロード ↗
               </a>`
            : `<div class="download-unavailable" style="margin-top:14px">
                 IPAのダウンロードリンクなし
               </div>`;
        })()
      }
    </div>`
  : `
    <div class="detail">
      <h2>対応バージョンが見つかりません</h2>
      <div class="small">
        この端末のiOS以下を最低対応OSとするバージョンが、
        アーカイブから確認できませんでした。
      </div>
    </div>`;

    const rows = versions
      .slice()
      .sort((a, b) => compareVersions(b.version, a.version))
      .map(v => {
        const minOS = v.minimum_os_version;
        const known = Boolean(minOS);
        const compatible = known &&
          compareVersions(deviceIOS, minOS) >= 0;

        
const copies = Array.isArray(v.copies) ? v.copies : [];

const links = copies.length
  ? copies.map((copy, index) => {
      const download =
        typeof copy.download_url === "string" &&
        /^https?:\/\//i.test(copy.download_url)
          ? `<a class="download-button"
               href="${escapeHTML(copy.download_url)}"
               target="_blank"
               rel="noopener noreferrer">⬇ IPAをダウンロード ↗</a>`
          : "";

      const manifest =
        typeof copy.manifest_url === "string" &&
        /^https?:\/\//i.test(copy.manifest_url)
          ? `<a class="download-button"
               href="${escapeHTML(copy.manifest_url)}"
               target="_blank"
               rel="noopener noreferrer">📲 インストール用リンク ↗</a>`
          : "";

      
return download || manifest
  ? `<div class="copy-card">
       <div class="copy-title">配布コピー ${index + 1}</div>
       <div class="copy-links">${download} ${manifest}</div>
     </div>`
  : "";
    }).join("")
  : `<div class="small"><span class="download-unavailable">IPAのダウンロードリンクなし</span></div>`;


        
return `
  <div class="version-row">
    <div class="version-heading">
      <strong>Version ${escapeHTML(v.version || "不明")}</strong>
      <span class="pill ${
        !known ? "status-unknown" : compatible ? "status-ok" : "status-no"
      }">${
        !known ? "OS不明" : compatible ? "OS条件OK" : "OS非対応"
      }</span>
    </div>

    <div class="version-meta">
      <span>最低対応iOS</span>
      <strong>${escapeHTML(minOS || "不明")}</strong>
    </div>

    <div class="version-links">
      ${links}
    </div>
  </div>`;
}).join("");

    detailsBox.innerHTML = `
      <div class="detail">
        <div style="display:flex;align-items:center;gap:13px">
          <img class="appicon" src="${escapeHTML(app.artworkUrl100 || "")}" alt="">
          <div>
            <h2>${escapeHTML(data.name || app.trackName)}</h2>
            <div class="dev">${escapeHTML(app.artistName || "")}</div>
          </div>
        </div>
        <div class="label">端末のiOS</div>
        <div class="value">${escapeHTML(deviceIOS)}</div>
        <div class="label">アーカイブのバージョン数</div>
        <div class="value">${versions.length}</div>
      </div>
      <h2 class="sectiontitle">おすすめのバージョン</h2>
      ${recommendation}
      <h2 class="sectiontitle">全バージョン</h2>
      ${rows || '<div class="detail">履歴がありません。</div>'}
    `;
  } catch (error) {
    detailsBox.innerHTML = `
      <div class="detail">
        <h2>履歴を取得できませんでした</h2>
        <div class="small">
          通信状態を確認して、もう一度試してください。
        </div>
        <a href="https://legacystore.app/" target="_blank"
           rel="noopener noreferrer">Legacy Storeを開く ↗</a>
      </div>`;
  }
}
</script>
</body>
</html>
